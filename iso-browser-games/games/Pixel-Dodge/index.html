<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>Pixel Dodge</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <div class="title">PIXEL DODGE</div>
        <div class="score-display">SCORE: <span id="score">0</span></div>
        <div class="high-score">HIGH: <span id="highScore">0</span></div>
        <canvas id="gameCanvas"></canvas>
        <div class="controls">
            <button id="leftBtn" class="control-btn">←</button>
            <button id="rightBtn" class="control-btn">→</button>
        </div>
        <div class="buttons">
            <button id="startBtn" class="main-btn">START</button>
            <button id="restartBtn" class="main-btn">RESTART</button>
        </div>
        <div class="instructions">
            <p>AVOID THE BLOCKS!</p>
            <p>USE ARROWS OR BUTTONS</p>
        </div>
        <div class="footer">RETRO PIXEL GAME</div>
    </div>
    <script src="script.js"></script>
</body>
</html>
